version: "1.0"
exclude_paths:
  - "cache/**"
  - "docs/**"
  - "**/static/**"
languages:
  python:
    exclude:
      # Route-registration functions are multi-endpoint registrars, not
      # algorithmically complex. Their cyclomatic complexity comes from
      # containing many independent route handlers, not from branching.
      - rule: CodeFactor/ComplexMethod
        paths:
          - "src/shift/ui_api/app.py"
